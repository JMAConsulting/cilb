site_name: Amazon SES (https://aws.amazon.com/ses/)
repo_url: https://lab.civicrm.org/extensions/ses
theme:
  name: material
markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.mark

nav:
- About: index.md
- Configuration: configuration.md
- Release Notes: releasenotes.md
